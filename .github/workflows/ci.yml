name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Secret Scanning & Security Gate
  # ============================================================================
  secret-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: "free" # Gitleaks is free for public and personal repos

  # ============================================================================
  # 2. Backend Quality Gate (Python / FastAPI)
  # ============================================================================
  backend-checks:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest pytest-asyncio pytest-cov

      - name: Run Ruff Linter & Formatter check
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Run Mypy Type Checker
        run: |
          mypy backend/app backend/tests --ignore-missing-imports

      - name: Run Pytest Test Suite
        env:
          APP_ENV: test
          SECRET_KEY: test-secret-key-for-ci-runs-only
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci-runs-only
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          LLM_PROVIDER: ollama
        run: |
          pytest backend/tests -v --cov=backend/app --cov-report=term-missing

  # ============================================================================
  # 3. Frontend Quality Gate (Next.js / TypeScript)
  # ============================================================================
  frontend-checks:
    name: Frontend Lint, Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: TypeScript Type Checking
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: ESLint Check
        working-directory: ./frontend
        run: npm run lint

      - name: Build Next.js Application
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build
